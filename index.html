<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전기설비 점검기록표</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { background: #f0f0f0; margin: 0; padding: 20px; font-family: sans-serif; }
    
    /* 양식 이미지를 감싸는 컨테이너 */
    .form-container {
      position: relative;
      width: 800px; /* 양식 고정 너비 (A4 비율) */
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* 원본 양식 이미지 */
    .bg-image {
      width: 100%;
      display: block;
    }

    /* 이미지 위에 얹어질 입력창 공통 스타일 */
    .field {
      position: absolute;
      background: rgba(230, 240, 255, 0.5); /* 위치 잡기용 연한 푸른색 (완성 후 transparent 변경 가능) */
      border: 1px solid #70a1ff;
      border-radius: 3px;
      font-size: 13px;
      padding: 2px 5px;
      box-sizing: border-box;
    }
    .field:focus {
      background: #ffffff;
      border: 2px solid #1e90ff;
      outline: none;
    }

    /* 체크 박스 / 토글 버튼 (O, X, /) */
    .check-field {
      position: absolute;
      cursor: pointer;
      font-weight: bold;
      text-align: center;
      color: #0000ed;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 서명 캔버스 */
    .sig-canvas {
      position: absolute;
      touch-action: none;
      border: 1px dashed #ffa500;
      background: rgba(255, 255, 255, 0.3);
    }

    .btn-bar { text-align: center; margin-top: 20px; }
    .btn-save { padding: 12px 25px; background: #2ed573; color: white; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

<div class="form-container" id="pdf-area">
  <img src="form_bg.jpg" class="bg-image" alt="전기설비 점검기록표 양식">

  <input type="text" class="field" style="top: 4.2%; left: 16%; width: 5%; text-align:center;" placeholder="26">
  <input type="text" class="field" style="top: 4.2%; left: 24%; width: 4%; text-align:center;" placeholder="09">

  <input type="text" class="field" style="top: 7.2%; left: 13%; width: 34%;" placeholder="수용가명 입력">

  <input type="text" class="field" style="top: 6.8%; left: 56%; width: 10%;">
  <input type="text" class="field" style="top: 6.8%; left: 77%; width: 10%;">

  <div class="check-field" style="top: 15.2%; left: 21.5%; width: 3.5%; height: 2.2%;" onclick="toggleMark(this)">O</div>
  <div class="check-field" style="top: 17.5%; left: 21.5%; width: 3.5%; height: 2.2%;" onclick="toggleMark(this)">O</div>

  <textarea class="field" style="top: 77%; left: 7%; width: 86%; height: 11%; background: transparent; border: none; font-size: 14px; line-height: 1.8;"></textarea>

  <canvas id="sig1" class="sig-canvas" style="top: 90.5%; left: 16%; width: 28%; height: 4%;"></canvas>
  
  <canvas id="sig2" class="sig-canvas" style="top: 90.5%; left: 60%; width: 28%; height: 4%;"></canvas>
</div>

<div class="btn-bar">
  <button class="btn-save" onclick="savePDF()">PDF 다운로드</button>
</div>

<script>
  function toggleMark(el) {
    if (el.innerText === 'O') el.innerText = 'X';
    else if (el.innerText === 'X') el.innerText = '/';
    else el.innerText = 'O';
  }

  // PDF 저장 시 오버레이 스타일 다듬기
  function savePDF() {
    const element = document.getElementById('pdf-area');
    const opt = {
      margin: 0,
      filename: '전기설비점검기록표.pdf',
      image: { type: 'jpeg', quality: 1 },
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
  }
</script>

</body>
</html>
